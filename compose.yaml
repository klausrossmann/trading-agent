name: trading-agent

# db, agent and dashboard; ib-gateway joins with COMPOSE_PROFILES=ibkr once the IBKR paper
# login exists (IMPLEMENTATION.md 15.3, 15.5).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_DB: trading
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, agent_db_password, dashboard_db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [backend]

  agent:
    build: .
    image: trading-agent:latest
    command: ["python", "-m", "trading_agent", "run"]
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    secrets:
      - source: agent_db_password
        target: db_password
      - trace_headers  # Langfuse OTLP auth (`make trace-headers`); empty = no auth header
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend, egress]

  # Read-only role, no .env (no API keys). Published on the host's loopback only;
  # `tailscale serve` makes it reachable in the tailnet.
  dashboard:
    build: .
    image: trading-agent:latest
    command: ["trading-agent", "dashboard", "--address", "0.0.0.0"]
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: dashboard
      TRACE_UI_URL: ${TRACE_UI_URL:-}  # "Open trace" links; no tracing keys here
    secrets:
      - source: dashboard_db_password
        target: db_password
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8501:8501"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend, frontend]  # an internal-only network can't publish ports

  # The TWS API port (4004 paper) is reachable only inside the Compose network: the protocol is
  # unauthenticated. VNC is on the host's loopback for maintenance through an SSH tunnel.
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    profiles: [ibkr]
    restart: unless-stopped
    environment:
      TWS_USERID: ${TWS_USERID:-}
      TWS_PASSWORD_FILE: /run/secrets/tws_password
      TRADING_MODE: paper
      READ_ONLY_API: ${IB_READ_ONLY_API:-yes}  # "no" together with IB_ORDERS_ENABLED=true (M8 step 5)
      TIME_ZONE: Europe/Berlin
      TZ: Europe/Berlin
      AUTO_RESTART_TIME: "11:45 PM"
      TWOFA_TIMEOUT_ACTION: restart
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      VNC_SERVER_PASSWORD_FILE: /run/secrets/vnc_password
    secrets: [tws_password, vnc_password]
    ports: ["127.0.0.1:5900:5900"]
    networks: [backend, egress]

networks:
  backend:
    internal: true
  egress: {}
  frontend: {}

volumes:
  pgdata: {}

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  agent_db_password:
    file: ./secrets/agent_db_password
  dashboard_db_password:
    file: ./secrets/dashboard_db_password
  tws_password:
    file: ./secrets/tws_password
  vnc_password:
    file: ./secrets/vnc_password
  trace_headers:
    file: ./secrets/trace_headers
