[project]
name = "trading-agent"
version = "0.1.0"
description = "Self-hosted swing-trading agent with a deterministic risk engine"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11,<4",
    "asyncpg>=0.31.0",
    "exchange-calendars>=4.13.2",
    "httpx>=0.28.1",
    "ib-async>=2.0.1",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[google]>=2.54.0",
    "pydantic-settings>=2.15.0",
    "python-telegram-bot>=22,<23",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.3",
    "streamlit>=1.65.0",
    "structlog>=26.1.0",
    "typer>=0.27.2",
    "tzdata>=2026.5",
    "yfinance>=1.7.0",
]

[project.scripts]
trading-agent = "trading_agent.__main__:app"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "import-linter>=2.15",
    "lxml>=6.1.3",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "DTZ", "PT", "TID"]
allowed-confusables = ["−", "ℹ"]  # typographic minus and info emoji in Telegram texts

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
pythonVersion = "3.13"
include = ["src", "tests", "migrations"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
strict = [
    "src/trading_agent/domain",
    "src/trading_agent/calc",
    "src/trading_agent/risk",
    "src/trading_agent/execution",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: needs a disposable Postgres; runs only when DB_NAME ends with _test",
    "ibkr: needs the IBKR paper gateway (Zenbook only, manual)",
    "llm: calls real LLM APIs (weekly evals, costs money)",
]

[tool.importlinter]
root_package = "trading_agent"

[[tool.importlinter.contracts]]
name = "LLM code has no path to orders"
type = "forbidden"
source_modules = ["trading_agent.llm", "trading_agent.modules", "trading_agent.agents"]
forbidden_modules = ["trading_agent.execution", "trading_agent.risk"]

[[tool.importlinter.contracts]]
name = "Risk engine is deterministic"
type = "forbidden"
source_modules = ["trading_agent.risk"]
forbidden_modules = ["trading_agent.llm", "trading_agent.modules", "trading_agent.agents"]

[[tool.importlinter.contracts]]
name = "Only the orchestration layer calls execution"
type = "forbidden"
source_modules = [
    "trading_agent.domain",
    "trading_agent.db",
    "trading_agent.data",
    "trading_agent.calc",
    "trading_agent.strategies",
    "trading_agent.modules",
    "trading_agent.llm",
    "trading_agent.agents",
    "trading_agent.risk",
    "trading_agent.portfolio",
    "trading_agent.evaluation",
    "trading_agent.notify",
    "trading_agent.dashboard",
]
forbidden_modules = ["trading_agent.execution"]

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["trading_agent.domain"]
forbidden_modules = [
    "trading_agent.settings",
    "trading_agent.db",
    "trading_agent.data",
    "trading_agent.calc",
    "trading_agent.strategies",
    "trading_agent.modules",
    "trading_agent.llm",
    "trading_agent.agents",
    "trading_agent.risk",
    "trading_agent.execution",
    "trading_agent.portfolio",
    "trading_agent.evaluation",
    "trading_agent.notify",
    "trading_agent.dashboard",
    "trading_agent.scheduler",
]

[[tool.importlinter.contracts]]
name = "Dashboard is read-only"
type = "forbidden"
source_modules = ["trading_agent.dashboard"]
forbidden_modules = [
    "trading_agent.risk",
    "trading_agent.llm",
    "trading_agent.agents",
    "trading_agent.notify",
    "trading_agent.scheduler",
]
