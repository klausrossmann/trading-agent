    "trading_agent.llm",
    "trading_agent.dashboard",
]
forbidden_modules = [
    "trading_agent.contexts",
    "trading_agent.orchestrator",
    "trading_agent.scheduler",
    "trading_agent.__main__",
]

[[tool.importlinter.contracts]]
name = "Dashboard is read-only"
type = "forbidden"
source_modules = ["trading_agent.dashboard"]
forbidden_modules = [
    "trading_agent.ibkr",
    "trading_agent.llm.runner",
    "trading_agent.risk.engine",
    "trading_agent.risk.controls",
    "trading_agent.risk.stage",
    "trading_agent.risk.store",
    "trading_agent.portfolio.manager",
    "trading_agent.telegram",
    "trading_agent.scheduler",
    "trading_agent.orchestrator",
    "ib_async",
    "telegram",
]
