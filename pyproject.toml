    "trading_agent.marketdata.quality",
    "trading_agent.marketdata.ingest",
    "trading_agent.marketdata.store",
    "trading_agent.marketdata.indicators",
    "trading_agent.marketdata.trend",
    "trading_agent.marketdata.macro",
    "trading_agent.marketdata.jobs",
    "trading_agent.news.types",
    "trading_agent.news.sources",
    "trading_agent.news.store",
    "trading_agent.news.agent",
    "trading_agent.news.rules",
    "trading_agent.screen.rules",
    "trading_agent.screen.screen",
    "trading_agent.analysts.technical",
    "trading_agent.analysts.earnings",
    "trading_agent.analysts.history",
    "trading_agent.analysts.levels",
    "trading_agent.analysts.level_refs",
    "trading_agent.proposer.agent",
    "trading_agent.proposer.types",
    "trading_agent.proposer.store",
    "trading_agent.critic.agent",
    "trading_agent.llm",
    "trading_agent.risk.engine",
    "trading_agent.risk.config",
    "trading_agent.risk.kill_switch",
    "trading_agent.risk.sizing",
    "trading_agent.risk.types",
    "trading_agent.risk.store",
    "trading_agent.portfolio.book",
    "trading_agent.portfolio.snapshot",
    "trading_agent.portfolio.tax",
    "trading_agent.portfolio.kpi",
    "trading_agent.portfolio.stops",
    "trading_agent.portfolio.fees",
    "trading_agent.portfolio.types",
    "trading_agent.portfolio.store",
    "trading_agent.telegram.messages",
    "trading_agent.telegram.bot",
    "trading_agent.telegram.heartbeat",
    "trading_agent.telegram.briefing",
    "trading_agent.telegram.journal",
    "trading_agent.screen.stage",
    "trading_agent.analysts.stage",
    "trading_agent.proposer.stage",
    "trading_agent.critic.stage",
    "trading_agent.dashboard",
