forbidden_modules = [
    "trading_agent.ibkr.link",
    "trading_agent.ibkr.market",
    "trading_agent.ibkr.orders",
    "trading_agent.ibkr.executor",
    "ib_async",
]

[[tool.importlinter.contracts]]
name = "Types are plain data"
type = "forbidden"
source_modules = [
    "trading_agent.*.types",
    "trading_agent.core.steps",
    "trading_agent.core.numbers",
    "trading_agent.ibkr.account",
    "trading_agent.analysts.level_refs",
]
forbidden_modules = [
    "sqlalchemy",
    "httpx",
    "ib_async",
    "telegram",
    "pydantic_ai",
    "trading_agent.core.db",
    "trading_agent.core.tables",
    "trading_agent.core.settings",
]

[[tool.importlinter.contracts]]
name = "Components never import the wiring"
type = "forbidden"
source_modules = [
    "trading_agent.core",
    "trading_agent.marketdata",
    "trading_agent.news",
    "trading_agent.screen",
    "trading_agent.analysts",
    "trading_agent.proposer",
