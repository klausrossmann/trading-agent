heartbeat:
  interval_minutes: 5

# Times are Europe/Berlin. Session jobs follow the exchange calendar (holidays, half-days, DST).
jobs:
  briefing:                         # data-only morning briefing via Telegram; skipped on holidays
    cron: {day_of_week: mon-fri, hour: 8, minute: 30}
    misfire_grace_minutes: 60
  ingest_macro:
    cron: {day_of_week: mon-fri, hour: 7, minute: 0}
    misfire_grace_minutes: 360
  ingest_earnings:
    cron: {day_of_week: mon-fri, hour: 7, minute: 15}
    misfire_grace_minutes: 360
  ingest_eod_eu:                    # EU bars, ECB FX, quality check
    calendar: XETR
    anchor: close
    offset_minutes: 30
    misfire_grace_minutes: 360
  ingest_eod_us:                    # US bars, quality check
    calendar: XNYS
    anchor: close
    offset_minutes: 30
    misfire_grace_minutes: 360
  evening_digest:                   # the day's proposals, orders, fills and exits
    calendar: XNYS
    anchor: close
    offset_minutes: 65
    misfire_grace_minutes: 360
  reconcile:                        # IBKR positions vs. the book; any difference halts
    calendar: XNYS
    anchor: close
    offset_minutes: 40
    misfire_grace_minutes: 360
  scan_eu:                          # agent proposals on the previous EOD bars (M7, no orders)
    calendar: XETR
    anchor: open
    offset_minutes: -45
    misfire_grace_minutes: 30
  scan_us:
    calendar: XNYS
    anchor: open
    offset_minutes: -45
    misfire_grace_minutes: 30
  place_eu:                         # risk engine -> brackets for today's EU proposals (M8)
    calendar: XETR
    anchor: open
    offset_minutes: 15
    misfire_grace_minutes: 2        # a late placement is skipped, not run late
  place_us:
    calendar: XNYS
    anchor: open
    offset_minutes: 15
    misfire_grace_minutes: 2
  execution_eu:                     # IBKR sync, stops, time stops, agent book
    calendar: XETR
    anchor: close
    offset_minutes: 35
    misfire_grace_minutes: 360
  execution_us:
    calendar: XNYS
    anchor: close
    offset_minutes: 35
    misfire_grace_minutes: 360
  monitor:                          # IBKR sync in sessions
    cron: {day_of_week: mon-fri, hour: "9-22", minute: "*/10"}
    misfire_grace_minutes: 5
  news_positions:                   # held stocks' news -> News agent -> exit at the market
    cron: {day_of_week: mon-fri, hour: "7-22", minute: "0,30"}
    misfire_grace_minutes: 20
  news_eu:                          # EU stocks' news -> buy signals for the EU scan
    calendar: XETR
    anchor: open
    offset_minutes: -75
    misfire_grace_minutes: 25
  news_us:
    calendar: XNYS
    anchor: open
    offset_minutes: -75
    misfire_grace_minutes: 25
