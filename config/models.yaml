# LLM role -> model (IMPLEMENTATION.md 7.5). Model strings are PydanticAI's "<provider>:<model>";
# ids checked against pydantic-ai-slim 2.54 and Google's pricing page on 2026-10-04.
roles:
  triage: google:gemini-3.1-flash-lite
  analysis: google:gemini-3.8-flash
  proposer: google:gemini-3.8-flash
  critic: anthropic:claude-sonnet-5-5         # M7; needs ANTHROPIC_API_KEY and a price below

# Applied when LLM_DEV_OVERRIDES=true (Phase 0-1: Gemini free tier, no Anthropic key yet).
dev_overrides:
  critic: google:gemini-3.8-flash

# Paid-tier list prices in USD per 1M tokens (output includes thinking tokens). A model without a
# price is never called. Compare monthly with the invoice.
prices:
  google:gemini-3.8-flash:
    - {since: 2026-01-01, input: 0.75, output: 3.75}
    - {since: 2027-01-01, input: 1.50, output: 7.50}
  google:gemini-3.1-flash-lite:
    - {since: 2026-01-01, input: 0.25, output: 1.50}

budget:
  monthly_usd: 16                  # about EUR 15 a month
  lean_mode_at: 0.8                # fewer candidates per scan
  hard_stop_at: 1.0                # no more LLM calls this month; the baseline keeps running

# Client-side pacing. Free-tier limits are shown in Google AI Studio under "Rate limits".
rate_limits_rpm:
  google:gemini-3.8-flash: 10
  google:gemini-3.1-flash-lite: 15

scan:
  candidates: 10                   # top baseline setups analysed per scan
  candidates_lean: 5
