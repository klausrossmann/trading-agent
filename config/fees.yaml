# IBKR Pro commissions for SmartRouted API orders. Checked against
# interactivebrokers.ie/en/pricing/commissions-stocks.php on 2026-10-03.
# Third-party fees are conservative estimates; compare with the first paper fills (M8)
# and with the monthly statement.
markets:
  US:
    currency: USD
    plan: tiered
    tiered:
      per_share: 0.0035              # <= 300,000 shares/month
      min: 0.35
      max_pct_of_value: 1.0
      third_party_per_share: 0.0032  # estimate: exchange fee for removing liquidity + clearing
    fixed:
      per_share: 0.005
      min: 1.00
      max_pct_of_value: 1.0
    sell_regulatory:                 # upper bounds; check current rates (TAF holiday Oct-Dec 2026)
      pct_of_value: 0.00278          # SEC Section 31 fee ($27.80 per million)
      per_share: 0.000195            # FINRA Trading Activity Fee
      per_share_max: 9.79

  EU:                                # Germany (Xetra)
    currency: EUR
    plan: tiered
    tiered:
      pct_of_value: 0.05
      min: 1.25
      max: 29.00
      third_party_pct_of_value: 0.005  # estimate: Xetra exchange + clearing fees
      third_party_min: 0.60
    fixed:
      pct_of_value: 0.05
      min: 3.00
