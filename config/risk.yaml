# Hard limits (CONCEPT.md 6.1). Changes need explicit sign-off (IMPLEMENTATION.md 16.1).
capital:
  agent_budget_eur: 1000           # hard cap, also in paper (ignores the paper account's simulated balance)
  min_cash_reserve_pct: 10
  paper_budget_eur:                # paper only: separate notional sleeve per market (IMPLEMENTATION.md 19.1)
    US: 10000                      # budgets must differ: markets with the same budget share one account
    EU: 15000                      # Xetra minimum fees weigh more on small positions

per_trade:
  # Fractional shares: size grows linearly with the agents' confidence (proposer, adjusted by the
  # critic) from the min values at min_confidence to the max values at max_confidence.
  min_risk_pct: 0.75               # (entry - stop) * qty <= 0.75 % of the budget at min confidence
  max_risk_pct: 1.5                # ... 1.5 % at max confidence (EUR 15 on EUR 1,000)
  min_position_pct: 10             # entry * qty <= 10 % of the budget at min confidence
  max_position_pct: 25             # ... 25 % at max confidence
  min_confidence: 0.30             # break-even at reward to risk 2 is 0.33; most setups are 0.3-0.5
  max_confidence: 0.60
  min_position_eur: 100
  max_fee_to_risk_pct: 10          # reject if round-trip fees exceed 10 % of the money at risk
  require_broker_side_stop: true   # GTC stop at IBKR, so downtime never leaves a position unprotected
  order_type: limit_only
  max_limit_deviation_pct: 1.0     # limit at most 1 % above the current mid; any distance below
  min_risk_reward: 2.0
  stop_atr_min: 1.0                # stop distance (entry - stop) in ATR(14)
  stop_atr_max: 4.0

portfolio:
  max_open_positions: 8
  max_sector_pct: 60
  max_correlated_cluster_pct: 60   # holdings with rho > 0.7 counted together

loss_limits:                       # breaching any -> stop new entries, notify
  daily_loss_pct: 3
  weekly_loss_pct: 6
  max_drawdown_pct: 15             # EUR 150 -> kill switch: close-only mode, needs manual reset

markets:
  paper: [US, EU]
  live: [US]                       # add EU at >= EUR 5,000 (CONCEPT.md 6.3)

instruments:                       # the universe itself is config/universe.yaml (S&P 100, DAX 40)
  min_avg_daily_dollar_volume: 20000000
  min_price: 5
  blacklist: []                    # Yahoo symbols, e.g. [TSLA, SAP.DE]: never scanned or traded

execution:
  routing: smart                   # IBKR Tiered pricing is not available for directed API orders
  max_orders_per_day: 8
  no_trading_first_minutes: 15
  no_trading_last_minutes: 10
  no_new_entries_before_earnings_days: 3   # unless strategy == earnings
