prices:
  backfill_years: 6                 # 5 years of backtest + warm-up for the 200-day average
  overlap_sessions: 5               # re-fetched on every update to catch revisions
  restatement_tolerance_pct: 0.5    # larger close differences in the overlap -> refetch full history

fx:                                 # quote currency -> ECB Data Portal series (units per 1 EUR)
  USD: EXR/D.USD.EUR.SP00.A

macro:
  fred:                             # needs FRED_API_KEY; skipped without it
    - DGS10                         # 10-year Treasury yield
    - DGS2                          # 2-year Treasury yield
    - T10Y2Y                        # 10y-2y spread
    - DFF                           # effective fed funds rate
    - CPIAUCSL                      # CPI (monthly)
    - UNRATE                        # unemployment rate (monthly)
    - VIXCLS                        # VIX
    - BAMLH0A0HYM2                  # US high-yield OAS
    - DTWEXBGS                      # broad USD index
  ecb:                              # series id -> ECB Data Portal series
    ECB_DFR: FM/B.U2.EUR.4F.KR.DFR.LEV   # ECB deposit facility rate

earnings:
  history_limit: 24                 # events per symbol on backfill (~5 years + upcoming)
  daily_limit: 4                    # events per symbol on the daily refresh

quality:
  max_jump_pct: 40                  # close-to-close move flagged as a possible unadjusted split
  stale_sessions: 2                 # last bar older than this many sessions -> stale
  block_window_sessions: 20         # issues this recent exclude the symbol from scans
